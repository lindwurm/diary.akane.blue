{{- $posts := partial "func/posts.html" . -}}
{{- if $posts }}
<article class="read-next-card" {{ with site.Params.header_image }} style="background-image: url({{ . }})" {{ end }} >
  <header class="read-next-card-header">
    <small class="read-next-card-header-sitetitle">&mdash; {{ site.Title }} &mdash;</small>
    <h3 class="read-next-card-header-title">{{ i18n "recent_posts" }}</h3>
  </header>
  <div class="read-next-divider">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M13 14.5s2 3 5 3 5.5-2.463 5.5-5.5S21 6.5 18 6.5c-5 0-7 11-12 11C2.962 17.5.5 15.037.5 12S3 6.5 6 6.5s4.5 3.5 4.5 3.5"/>
    </svg>
  </div>
  <div class="read-next-card-content">
    <ul>
      {{ range first 3 $posts -}}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
  </div>
  <footer class="read-next-card-footer">
    <a href="/archives">  MORE  → </a>
  </footer>
</article>
{{- end }}
